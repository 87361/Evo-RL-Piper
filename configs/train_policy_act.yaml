backend: lerobot
policy_config: policy/act.yaml
policy:
  # Inline fields override policy_config values.
  device: cuda
  push_to_hub: false
dataset:
  repo_id: pipeline_ab/A
  root: /path/to/lerobot/dataset
  revision: v3.0
train:
  # Aligned with kuavo_data_challenge default:
  # max_epoch=20 and max_training_step=null, where
  # num_steps = 20 * ((total_frames // batch_size) + 1).
  # For current A dataset (total_frames=13949, batch_size=32): steps=8720.
  steps: 8720
  batch_size: 32
  num_workers: 8
  eval_freq: 0
  log_freq: 1
  save_checkpoint: false
  job_name: act_smoke
lerobot:
  script_path: src/lerobot/scripts/lerobot_train.py
  extra_args: []

