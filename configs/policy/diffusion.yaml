type: diffusion
device: cuda
push_to_hub: false

# Common diffusion-policy knobs.
n_obs_steps: 2
horizon: 16
n_action_steps: 8
num_inference_steps: 10
vision_backbone: resnet18
crop_shape: [76, 76]
down_dims: [512, 1024, 2048]
kernel_size: 5
n_groups: 8
diffusion_step_embed_dim: 128
use_film_scale_modulation: true
